<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blubb Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#D9DEEB">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #D9DEEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #29292b;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Every screen is a full-viewport layer, hidden by default via inline style */
    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Welcome screen typography */
    #screen-welcome h1 {
      font-weight: 900;
      font-size: clamp(80px, 25vw, 120px);
      line-height: 0.85;
      letter-spacing: -0.07em;
      margin: 0 0 24px -4px;
    }
    #screen-welcome p {
      font-weight: 200;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 60px 0;
    }
    #screen-welcome .start-btn {
      font-weight: 800;
      font-size: clamp(1.4rem, 5vw, 2rem);
      letter-spacing: -0.02em;
      background: #29292b;
      color: #fff;
      border: none;
      padding: 28px 56px;
      border-radius: 45px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    #screen-welcome .start-btn:active { transform: scale(0.95); }

    /* Workout cards stacking */
    .workout-card {
      transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
      margin-bottom: -150px;
      cursor: pointer;
      position: relative;
      border-radius: 50px;
      background-color: #ffffff;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .workout-card.expanded {
      margin-bottom: 20px;
      margin-top: 10px;
      transform: scale(1.02);
      z-index: 1000 !important;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    /* Hide number input spinners */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Inputs look like plain text */
    input, textarea {
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      border: none;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.93); }

    .stepper-btn {
      width: 48px; height: 48px;
      border-radius: 999px;
      border: 1.5px solid #29292b !important;
      background: transparent;
      color: #29292b;
      font-size: 1.6rem;
      font-weight: 300;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       SCREEN 1: WELCOME
       display:flex is set inline — no CSS class needed
  ============================================================ -->
  <div id="screen-welcome" class="screen" style="
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 48px 15vh;
    background: linear-gradient(180deg, #D9DEEB 0%, #EC9B91 100%);
  ">
    <h1>Blubb</h1>
    <p>the fitness app<br>for pandas<br>by pandas</p>
    <button class="start-btn" onclick="nav('dashboard')">Start!</button>
  </div>

  <!-- ============================================================
       SCREEN 2: DASHBOARD
  ============================================================ -->
  <div id="screen-dashboard" class="screen" style="display:none; background:#1a1a1b;">

    <!-- Pink header -->
    <div style="
      background: linear-gradient(180deg, #e8a3a9 0%, #d76972 100%);
      border-radius: 0 0 50px 50px;
      padding: 64px 32px 80px;
      position: relative;
    ">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div style="font-size:2.8rem; font-weight:200; letter-spacing:-0.03em; color:#29292b;">hi panda!</div>
          <div style="font-size:1.1rem; font-weight:200; color:#29292b; opacity:0.7; margin-top:4px;">panda is strong.</div>
        </div>
        <div style="background:#29292b; color:#d76972; padding:16px; border-radius:24px; text-align:center; min-width:90px;">
          <div id="dash-day" style="font-size:2.4rem; font-weight:700; line-height:1;">--</div>
          <div id="dash-month" style="font-size:0.9rem; text-transform:uppercase; letter-spacing:0.15em; font-weight:300; margin-top:4px;">---</div>
        </div>
      </div>

      <!-- FAB -->
      <div style="position:absolute; bottom:-40px; left:50%; transform:translateX(-50%);">
        <div style="background:#1a1a1b; padding:12px; border-radius:999px;">
          <button onclick="startNewWorkout()" style="
            background:#d76972; color:#fff;
            width:80px; height:80px; border-radius:999px;
            font-size:3rem; font-weight:200;
            display:flex; align-items:center; justify-content:center;
            box-shadow: 0 8px 24px rgba(215,105,114,0.5);
          ">+</button>
        </div>
      </div>
    </div>

    <!-- Past workouts list -->
    <div style="margin-top:80px; padding:0 24px 120px;">
      <div style="color:#fff; font-size:1.8rem; font-weight:200; opacity:0.4; margin-bottom:32px; text-transform:lowercase;">
        past workouts
      </div>
      <div id="past-workouts-container" style="display:flex; flex-direction:column;"></div>
    </div>
  </div>

  <!-- ============================================================
       SCREEN 3: WORKOUT SESSION
  ============================================================ -->
  <div id="screen-workout" class="screen" style="display:none; background:#1a1a1b; padding:24px;">

    <div style="background:#dbdee9; border-radius:40px; padding:32px; margin-top:40px; margin-bottom:32px;">
      <input type="text" id="workout-date-input"
        style="font-size:1.8rem; font-weight:700; display:block; width:100%; margin-bottom:4px;" />
      <input type="text" id="workout-title-input"
        style="font-size:1.1rem; font-weight:200; width:100%; opacity:0.6;" />
    </div>

    <div id="current-session-exercises"
      style="display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-bottom:120px;"></div>

    <div style="position:fixed; bottom:40px; left:0; width:100%; padding:0 32px;
                display:flex; justify-content:space-between; align-items:center;">
      <button onclick="nav('dashboard')"
        style="color:#d76972; font-size:1.4rem; font-weight:200; background:none;">← Exit</button>
      <button onclick="saveFullWorkout(event)" style="
        background:#d76972; color:#fff;
        padding:16px 40px; border-radius:999px;
        font-size:1.1rem; font-weight:700;
        box-shadow:0 8px 24px rgba(215,105,114,0.4);
      ">Save!</button>
    </div>
  </div>

  <!-- ============================================================
       SCREEN 4: EXERCISE SELECTION
  ============================================================ -->
  <div id="screen-exercise-selection" class="screen" style="display:none; background:#d76972; padding:32px;">
    <button onclick="nav('workout')"
      style="color:#fff; font-size:1.1rem; font-weight:200; background:none; margin-bottom:40px; display:block;">
      ← Cancel
    </button>
    <div id="exercise-library-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
      <div id="add-exercise-tile"
        style="background:#29292b; border-radius:40px; aspect-ratio:1; display:flex; align-items:center; justify-content:center;">
        <button onclick="spawnNewExercise()"
          style="color:#fff; font-size:3.5rem; font-weight:200; background:none; width:100%; height:100%;">+</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SCREEN 5: EXERCISE LOGGER
  ============================================================ -->
  <div id="screen-logger" class="screen" style="display:none; background:#d76972; padding:32px;">
    <button onclick="nav('exercise-selection')"
      style="color:#fff; font-size:1.1rem; font-weight:200; background:none; margin-bottom:24px; display:block;">
      ← Cancel
    </button>

    <input type="text" id="log-ex-name" style="
      font-size:3rem; font-weight:900; letter-spacing:-0.04em;
      color:#29292b; width:100%; margin-bottom:8px; text-transform:lowercase;
    " />
    <textarea id="log-notes" placeholder="notes go here..." style="
      width:100%; height:80px; font-weight:200; font-size:1.1rem;
      color:#29292b; opacity:0.6; resize:none; margin-bottom:32px;
      text-transform:lowercase; background:transparent; border:none; outline:none; font-family:inherit;
    "></textarea>

    <div style="display:flex; flex-direction:column; gap:16px; padding-bottom:120px;">

      <div style="display:flex; justify-content:space-between; align-items:center;
                  background:rgba(219,222,233,0.25); padding:16px; border-radius:24px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <input type="number" id="val-sets" value="0"
            style="font-size:3rem; font-weight:700; width:64px; text-align:center; color:#29292b;" />
          <span style="font-size:1.1rem; font-weight:200; opacity:0.6; color:#29292b;">Sets</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button onclick="step('sets',-1)" class="stepper-btn">−</button>
          <button onclick="step('sets', 1)" class="stepper-btn">+</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;
                  background:rgba(219,222,233,0.25); padding:16px; border-radius:24px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <input type="number" id="val-reps" value="0"
            style="font-size:3rem; font-weight:700; width:64px; text-align:center; color:#29292b;" />
          <span style="font-size:1.1rem; font-weight:200; opacity:0.6; color:#29292b;">Reps</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button onclick="step('reps',-1)" class="stepper-btn">−</button>
          <button onclick="step('reps', 1)" class="stepper-btn">+</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;
                  background:rgba(219,222,233,0.25); padding:16px; border-radius:24px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <input type="number" id="val-rir" value="0"
            style="font-size:3rem; font-weight:700; width:80px; text-align:center; color:#29292b;" />
          <span style="font-size:1.1rem; font-weight:200; opacity:0.6; color:#29292b;">RIR</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button onclick="step('rir',-1)" class="stepper-btn">−</button>
          <button onclick="step('rir', 1)" class="stepper-btn">+</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;
                  background:rgba(219,222,233,0.25); padding:16px; border-radius:24px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <input type="number" id="val-weight" value="0"
            style="font-size:3rem; font-weight:700; width:80px; text-align:center; color:#29292b;" />
          <span style="font-size:1.1rem; font-weight:200; opacity:0.6; color:#29292b;">kg</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button onclick="step('weight',-2.5)" class="stepper-btn">−</button>
          <button onclick="step('weight', 2.5)" class="stepper-btn">+</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;
                  background:rgba(219,222,233,0.25); padding:16px; border-radius:24px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <input type="number" id="val-time" value="0"
            style="font-size:3rem; font-weight:700; width:80px; text-align:center; color:#29292b;" />
          <span style="font-size:1.1rem; font-weight:200; opacity:0.6; color:#29292b;">mins</span>
        </div>
        <div style="display:flex; gap:12px;">
          <button onclick="step('time',-5)" class="stepper-btn">−</button>
          <button onclick="step('time', 5)" class="stepper-btn">+</button>
        </div>
      </div>

    </div>

    <div style="position:fixed; bottom:40px; left:0; width:100%; padding:0 32px;">
      <button onclick="addExerciseToSession()" style="
        width:100%; background:#29292b; color:#fff;
        padding:24px; border-radius:999px;
        font-size:1.3rem; font-weight:700;
        box-shadow:0 8px 32px rgba(0,0,0,0.3);
      ">Save!</button>
    </div>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────────
    let exerciseLibrary = ['bench press', 'lat pulldown'];
    let history = [];
    let currentSession = null;
    let editingExerciseIndex = null;
    let editingHistoryIndex = null;
    const SCRIPT_URL = "YOUR_DEPLOYED_URL_HERE";

    // ── Navigation ───────────────────────────────────────────────
    // Sets style.display directly — zero CSS class cascade, zero Tailwind conflicts.
    const SCREENS = ['welcome', 'dashboard', 'workout', 'exercise-selection', 'logger'];

    function nav(screenId) {
      SCREENS.forEach(id => {
        document.getElementById('screen-' + id).style.display = 'none';
      });
      // Welcome uses flex, everything else block
      document.getElementById('screen-' + screenId).style.display =
        screenId === 'welcome' ? 'flex' : 'block';

      if (screenId === 'dashboard') {
        updateDates();
        renderHistory();
      }
    }

    // ── Dates ────────────────────────────────────────────────────
    function updateDates() {
      const now = new Date();
      const months = ["january","february","march","april","may","june",
                      "july","august","september","october","november","december"];
      document.getElementById("dash-day").innerText = now.getDate();
      document.getElementById("dash-month").innerText = months[now.getMonth()].substring(0, 3);
      document.getElementById("workout-date-input").value =
        `${now.getDate()} ${months[now.getMonth()]}`;
    }

    // ── Workout session ──────────────────────────────────────────
    function startNewWorkout() {
      editingHistoryIndex = null;
      currentSession = {
        date: document.getElementById("workout-date-input").value,
        title: "pattern A",
        exercises: [],
      };
      document.getElementById("workout-title-input").value = "pattern A";
      renderSession();
      nav("workout");
    }

    function editPastWorkout(index) {
      editingHistoryIndex = index;
      currentSession = JSON.parse(JSON.stringify(history[index]));
      document.getElementById("workout-date-input").value = currentSession.date;
      document.getElementById("workout-title-input").value = currentSession.title;
      renderSession();
      nav("workout");
    }

    function renderSession() {
      const container = document.getElementById("current-session-exercises");
      container.innerHTML = "";
      currentSession.exercises.forEach((ex, index) => {
        const div = document.createElement("div");
        div.style.cssText = `
          background:#d76972; aspect-ratio:1; border-radius:30px; padding:20px;
          color:#29292b; display:flex; flex-direction:column; justify-content:space-between;
          cursor:pointer; box-shadow:0 4px 16px rgba(215,105,114,0.3);`;
        div.onclick = () => openLogger(ex.name, index);
        div.innerHTML = `
          <span style="font-size:1.1rem; font-weight:700; line-height:1.2; text-transform:lowercase;">${ex.name}</span>
          <span style="font-size:0.75rem; font-weight:700; opacity:0.8; text-transform:uppercase;">${ex.sets}s / ${ex.reps}r / ${ex.weight}kg</span>`;
        container.appendChild(div);
      });

      const addTile = document.createElement("div");
      addTile.style.cssText = `
        aspect-ratio:1; border-radius:30px;
        border:2px dashed rgba(215,105,114,0.3);
        display:flex; align-items:center; justify-content:center;`;
      addTile.innerHTML = `<button onclick="nav('exercise-selection')" style="
        background:#d76972; color:#fff; width:64px; height:64px; border-radius:999px;
        font-size:2rem; font-weight:200; box-shadow:0 4px 16px rgba(215,105,114,0.4);">+</button>`;
      container.appendChild(addTile);
    }

    // ── Exercise library ─────────────────────────────────────────
    function spawnNewExercise() {
      const name = prompt("New exercise name:");
      if (!name || !name.trim()) return;
      const lower = name.trim().toLowerCase();
      if (!exerciseLibrary.includes(lower)) {
        exerciseLibrary.push(lower);
        localStorage.setItem('blubb_library', JSON.stringify(exerciseLibrary));
        renderLibrary();
      }
      openLogger(lower);
    }

    function renderLibrary() {
      const grid = document.getElementById("exercise-library-grid");
      const addTile = document.getElementById("add-exercise-tile");
      grid.innerHTML = "";
      grid.appendChild(addTile);
      exerciseLibrary.forEach(exName => {
        const btn = document.createElement("button");
        btn.onclick = () => openLogger(exName);
        btn.style.cssText = `
          background:#29292b; border-radius:40px; aspect-ratio:1; padding:24px;
          text-align:left; display:flex; flex-direction:column; justify-content:flex-end;`;
        btn.innerHTML = `<span style="color:#fff; font-size:1.3rem; font-weight:200; line-height:1.2;
          text-transform:lowercase;">${exName.replace(" ", "<br>")}</span>`;
        grid.appendChild(btn);
      });
    }

    // ── Logger ───────────────────────────────────────────────────
    function openLogger(name, index = null) {
      editingExerciseIndex = index;
      if (index !== null) {
        const ex = currentSession.exercises[index];
        document.getElementById("log-ex-name").value  = ex.name;
        document.getElementById("log-notes").value    = ex.notes  || "";
        document.getElementById("val-sets").value     = ex.sets;
        document.getElementById("val-reps").value     = ex.reps;
        document.getElementById("val-rir").value      = ex.rir    || 0;
        document.getElementById("val-weight").value   = ex.weight;
        document.getElementById("val-time").value     = ex.time   || 0;
      } else {
        document.getElementById("log-ex-name").value  = name;
        document.getElementById("log-notes").value    = "";
        document.getElementById("val-sets").value     = 0;
        document.getElementById("val-reps").value     = 0;
        document.getElementById("val-rir").value      = 0;
        document.getElementById("val-weight").value   = 0;
        document.getElementById("val-time").value     = 0;
      }
      nav("logger");
    }

    function step(id, amt) {
      const el = document.getElementById("val-" + id);
      const val = Math.max(0, parseFloat(el.value) + amt);
      el.value = Number.isInteger(val) ? val : val.toFixed(1);
    }

    function addExerciseToSession() {
      const exData = {
        name:   document.getElementById("log-ex-name").value,
        notes:  document.getElementById("log-notes").value,
        sets:   document.getElementById("val-sets").value,
        reps:   document.getElementById("val-reps").value,
        rir:    document.getElementById("val-rir").value,
        weight: document.getElementById("val-weight").value,
        time:   document.getElementById("val-time").value,
      };
      if (editingExerciseIndex !== null) {
        currentSession.exercises[editingExerciseIndex] = exData;
      } else {
        currentSession.exercises.push(exData);
      }
      renderSession();
      nav("workout");
    }

    // ── Save workout ─────────────────────────────────────────────
    async function saveFullWorkout(e) {
      const btn = e.target;
      currentSession.date  = document.getElementById("workout-date-input").value;
      currentSession.title = document.getElementById("workout-title-input").value;
      if (currentSession.exercises.length === 0) return;

      btn.innerText = "Saving... 🚀";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(currentSession),
        });
        if (editingHistoryIndex !== null) {
          history[editingHistoryIndex] = { ...currentSession };
        } else {
          history.unshift({ ...currentSession });
        }
        localStorage.setItem('blubb_history', JSON.stringify(history));
        btn.innerText = "Saved! 🐼";
        setTimeout(() => { btn.innerText = "Save!"; btn.disabled = false; nav("dashboard"); }, 1000);
      } catch {
        alert("Error saving!");
        btn.innerText = "Save!";
        btn.disabled = false;
      }
    }

    // ── Render history ───────────────────────────────────────────
    function renderHistory() {
      const container = document.getElementById("past-workouts-container");
      container.innerHTML = "";
      if (history.length === 0) return;

      history.forEach((workout, index) => {
        const card = document.createElement("div");
        card.className = "workout-card";
        card.style.zIndex = history.length - index;

        const exHtml = workout.exercises.map(ex => `
          <div style="display:flex; justify-content:space-between; padding:12px 0;
                      border-bottom:1px solid rgba(0,0,0,0.05); font-size:0.9rem; text-transform:lowercase;">
            <span style="font-weight:200;">${ex.name}</span>
            <span style="font-weight:700;">${ex.sets}s / ${ex.reps}r / ${ex.weight}kg</span>
          </div>`).join("");

        card.innerHTML = `
          <div style="padding:40px;">
            <div style="font-size:1rem; opacity:0.4; font-weight:200; text-transform:lowercase;">${workout.date}</div>
            <div style="font-size:2.2rem; font-weight:900; text-transform:uppercase; letter-spacing:-0.03em; margin-bottom:8px;">${workout.title}</div>
            <div class="exercise-summary" style="display:none; margin-top:24px;">
              ${exHtml}
              <button onclick="editPastWorkout(${index})" style="
                width:100%; margin-top:32px; background:#29292b; color:#fff;
                padding:20px; border-radius:999px; font-weight:700;
                font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase;">
                Edit Workout
              </button>
            </div>
          </div>`;

        card.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          const isExpanded = card.classList.contains("expanded");
          document.querySelectorAll(".workout-card").forEach((c, idx) => {
            c.classList.remove("expanded");
            c.querySelector(".exercise-summary").style.display = "none";
            c.style.zIndex = history.length - idx;
          });
          if (!isExpanded) {
            card.classList.add("expanded");
            card.querySelector(".exercise-summary").style.display = "block";
            card.style.zIndex = 1000;
          }
        };

        container.appendChild(card);
      });
    }

    // ── Init ─────────────────────────────────────────────────────
    function init() {
      updateDates();
      const savedHistory = localStorage.getItem('blubb_history');
      if (savedHistory) history = JSON.parse(savedHistory);
      const savedLibrary = localStorage.getItem('blubb_library');
      if (savedLibrary) exerciseLibrary = JSON.parse(savedLibrary);
      renderLibrary();
      renderHistory();
    }

    init();
  </script>
</body>
</html>
